name: Finish DemoF mirror

on:
  push:

permissions:
  contents: write
  actions: write

jobs:
  mirror_workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DemoF
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source workflows
        shell: bash
        run: |
          git clone --depth 1 --branch feature/full-app-implementation https://github.com/LonelyChromosome/demoD.git /tmp/demoD
          rsync -a --delete /tmp/demoD/.github/workflows/ .github/workflows/

      - name: Commit exact workflow mirror
        shell: bash
        run: |
          git config user.name "cooc"
          git config user.email "minhdaonguyenad@gmail.com"
          git add .github/workflows
          git commit -m "chore: mirror Better Phenikaa 1.0 workflows"
          git push origin HEAD:main
