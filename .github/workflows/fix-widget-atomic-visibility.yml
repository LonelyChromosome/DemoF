name: Fix widget atomic visibility refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-widget-atomic-visibility.yml'

permissions:
  contents: write

jobs:
  fix-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch widget refresh visibility
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          provider = Path('platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt')
          s = provider.read_text(encoding='utf-8')

          old = '''            if (cover != null) {
                views.setImageViewBitmap(R.id.widget_refresh_cover, cover)
                views.setViewVisibility(R.id.widget_refresh_cover, View.VISIBLE)
                views.setDisplayedChild(R.id.widget_list, 0)
            } else {
                views.setViewVisibility(R.id.widget_refresh_cover, View.GONE)
            }
        } else {
            views.setViewVisibility(R.id.widget_refresh_cover, View.GONE)
        }'''
          new = '''            if (cover != null) {
                views.setImageViewBitmap(R.id.widget_refresh_cover, cover)
                views.setViewVisibility(R.id.widget_refresh_cover, View.VISIBLE)
                // Samsung Launcher can temporarily compose several StackView children
                // while a RemoteViewsFactory is invalidating. Keep the collection
                // laid out/loading but invisible until the refreshed stack is stable.
                // The opaque cover already uses the new theme, so theme changes look
                // immediate without exposing mixed old/new frames.
                views.setViewVisibility(R.id.widget_list, View.INVISIBLE)
            } else {
                views.setViewVisibility(R.id.widget_refresh_cover, View.GONE)
                views.setViewVisibility(R.id.widget_list, View.VISIBLE)
            }
        } else {
            views.setViewVisibility(R.id.widget_refresh_cover, View.GONE)
            views.setViewVisibility(R.id.widget_list, View.VISIBLE)
        }'''
          if old not in s:
              raise SystemExit('refresh-cover block marker missing')
          s = s.replace(old, new, 1)

          old = '''            val reveal = RemoteViews(context.packageName, R.layout.schedule_widget)
            reveal.setViewVisibility(R.id.widget_refresh_cover, View.GONE)
            appWidgetManager.partiallyUpdateAppWidget(widgetId, reveal)'''
          new = '''            val reveal = RemoteViews(context.packageName, R.layout.schedule_widget)
            // Reveal both actions in one RemoteViews transaction. Never expose the
            // live StackView before the temporary cover has finished its job.
            reveal.setViewVisibility(R.id.widget_list, View.VISIBLE)
            reveal.setViewVisibility(R.id.widget_refresh_cover, View.GONE)
            appWidgetManager.partiallyUpdateAppWidget(widgetId, reveal)'''
          if old not in s:
              raise SystemExit('reveal block marker missing')
          s = s.replace(old, new, 1)

          # Give Samsung launcher enough time to finish factory invalidation. This is
          # not a visible delay because the clean, newly-themed cover is already shown.
          s = s.replace('private const val REFRESH_COVER_HOLD_MS = 1250L', 'private const val REFRESH_COVER_HOLD_MS = 1600L', 1)
          provider.write_text(s, encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          p = pubspec.read_text(encoding='utf-8')
          p = p.replace('version: 2.0.7+12', 'version: 2.0.8+13', 1)
          pubspec.write_text(p, encoding='utf-8')
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap
        run: bash tool/bootstrap.sh

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify regression guards
        shell: bash
        run: |
          set -euo pipefail
          P=platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          A=lib/app/app.dart
          grep -q 'widget_list, View.INVISIBLE' "$P"
          grep -q 'widget_list, View.VISIBLE' "$P"
          ! grep -A8 'if (showRefreshCover)' "$P" | grep -q 'setDisplayedChild'
          grep -q 'REFRESH_COVER_HOLD_MS = 1600L' "$P"
          grep -q 'AppThemeId.youtube => const Color(0xFF3EA6FF)' "$A"
          grep -q 'AppThemeId.valorant => const Color(0xFF56D6C7)' "$A"
          grep -q 'AppThemeId.minecraft => const Color(0xFF42A5F5)' "$A"
          grep -q '_contrastForeground(color)' "$A"
          grep -q '^version: 2.0.8+13$' pubspec.yaml
          grep -q 'qldtbeta.phenikaa-uni.edu.vn' lib/features/qldt_intake/qldt_login_mobile.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Package APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better_Phenikaa_App_v2.0.8.apk
          sha256sum dist/Better_Phenikaa_App_v2.0.8.apk > dist/Better_Phenikaa_App_v2.0.8.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-v2.0.8-atomic-widget
          path: dist/*
          retention-days: 30

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'cooc'
          git config user.email 'minhdaonguyenad@gmail.com'
          git add platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt pubspec.yaml
          git commit -m 'fix: hide live stack during atomic widget refresh'
          git push origin HEAD:main

