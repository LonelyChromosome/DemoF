name: Finalize Better Phenikaa 2.0 theme sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-theme-widget-sync.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror theme into FlutterSharedPreferences
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/theme/app_theme.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "  static const _preferenceKey = 'better_phenikaa_theme_v2';\n",
              "  static const _preferenceKey = 'better_phenikaa_theme_v2';\n  static const _widgetPreferenceKey = 'appTheme';\n",
              1,
          )
          s = s.replace(
              "    notifyListeners();\n    await _syncWidgetTheme();\n  }\n\n  Future<void> select(AppThemeId value) async {",
              "    await prefs.setString(_widgetPreferenceKey, _theme.storageKey);\n    notifyListeners();\n    await _syncWidgetTheme();\n  }\n\n  Future<void> select(AppThemeId value) async {",
              1,
          )
          s = s.replace(
              "    await prefs.setString(_preferenceKey, value.storageKey);\n    await _syncWidgetTheme();",
              "    await prefs.setString(_preferenceKey, value.storageKey);\n    await prefs.setString(_widgetPreferenceKey, value.storageKey);\n    await _syncWidgetTheme();",
              1,
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap Android and dependencies
        run: bash tool/bootstrap.sh

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify app-widget theme contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "_widgetPreferenceKey = 'appTheme'" lib/theme/app_theme.dart
          grep -q 'prefs.setString(_widgetPreferenceKey' lib/theme/app_theme.dart
          grep -q 'getSharedPreferences("FlutterSharedPreferences"' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          grep -q 'THEME_KEY = "flutter.appTheme"' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt
          grep -q 'qldtbeta.phenikaa-uni.edu.vn' lib/features/qldt_intake/qldt_login_mobile.dart
          grep -q 'edu.system.makeRequest' lib/features/qldt_intake/qldt_login_mobile.dart
          grep -q '^version: 2.0.0+5$' pubspec.yaml

      - name: Build final release APK
        run: flutter build apk --release

      - name: Persist theme synchronization fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cooc'
          git config user.email 'minhdaonguyenad@gmail.com'
          git add lib/theme/app_theme.dart
          git commit -m 'fix: sync selected theme with native widget'
          git push origin HEAD:main

      - name: Package final APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better_Phenikaa_App_v2.0.0.apk
          sha256sum dist/Better_Phenikaa_App_v2.0.0.apk > dist/Better_Phenikaa_App_v2.0.0.sha256

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-v2.0.0-final
          path: |
            dist/Better_Phenikaa_App_v2.0.0.apk
            dist/Better_Phenikaa_App_v2.0.0.sha256
          retention-days: 30
          if-no-files-found: error
