name: Widget blur wipe transition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/widget-blur-wipe-transition.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply blur wipe transition
        run: python3 tool/apply_widget_blur_wipe_transition.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap project
        run: bash tool/bootstrap.sh

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify transition and widget regressions
        shell: bash
        run: |
          set -euo pipefail
          P=platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          S=platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt
          grep -q 'playRevealTransition' "$P"
          grep -q 'TRANSITION_FRAME_COUNT = 8' "$P"
          grep -q 'TRANSITION_PREPARE_MS = 520L' "$P"
          grep -q 'widget_list, View.INVISIBLE' "$P"
          grep -q 'renderWidgetTransitionFrame' "$S"
          grep -q 'RenderEffect.createBlurEffect' "$S"
          grep -q 'TRANSITION_EDGE_WIDTH_FRACTION' "$S"
          ! grep -q 'COLLECTION_READY_SETTLE_MS' "$P"
          ! grep -q 'setDisplayedChild(R.id.widget_list, 0)' "$P" || grep -q 'resetChildKey(widgetId)' "$P"
          grep -q '^version: 2.0.10+15$' pubspec.yaml

      - name: Build release APK
        run: flutter build apk --release

      - name: Package APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better_Phenikaa_App_v2.0.10.apk
          sha256sum dist/Better_Phenikaa_App_v2.0.10.apk > dist/Better_Phenikaa_App_v2.0.10.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-v2.0.10-blur-wipe
          path: dist/*
          retention-days: 30

      - name: Commit transition source
        shell: bash
        run: |
          git config user.name 'cooc'
          git config user.email 'minhdaonguyenad@gmail.com'
          git add platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt \
                  platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt \
                  pubspec.yaml
          git commit -m 'feat: mask widget refresh with blur wipe transition'
          git push origin HEAD:main
