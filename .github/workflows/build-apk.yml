name: Build Better Phenikaa App 2.1.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap project
        run: bash tool/bootstrap.sh

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/Better_Phenikaa_App_2.1.0.apk
          sha256sum dist/Better_Phenikaa_App_2.1.0.apk \
            > dist/Better_Phenikaa_App_2.1.0.sha256
          test -s dist/Better_Phenikaa_App_2.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-2.1.0
          path: |
            dist/Better_Phenikaa_App_2.1.0.apk
            dist/Better_Phenikaa_App_2.1.0.sha256
          retention-days: 14
