name: Fix Better Phenikaa 2.0 themes and widget v2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-theme-widget-v2b.yml'

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch live app theme refresh
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path('lib/app/app.dart')
          s = app.read_text(encoding='utf-8')
          needle = '    super.initState();\n    unawaited(_restore());'
          repl = '    super.initState();\n    AppThemeController.instance.addListener(_handleThemeChanged);\n    unawaited(_restore());'
          if needle not in s:
              raise SystemExit('app initState body marker missing')
          s = s.replace(needle, repl, 1)
          needle2 = '  }\n\n  Future<void> _restore() async {'
          repl2 = '''  }

            void _handleThemeChanged() {
              if (mounted) {
                setState(() {});
              }
            }

            @override
            void dispose() {
              AppThemeController.instance.removeListener(_handleThemeChanged);
              super.dispose();
            }

            Future<void> _restore() async {'''
          if needle2 not in s:
              raise SystemExit('app restore marker missing')
          s = s.replace(needle2, repl2, 1)
          app.write_text(s, encoding='utf-8')

          theme = Path('lib/theme/app_theme.dart')
          t = theme.read_text(encoding='utf-8')
          start = t.index('class AppThemeSettingButton extends StatelessWidget {')
          replacement = r'''class AppThemeSettingButton extends StatelessWidget {
            const new({super.key});

            @override
            Widget build(BuildContext context) {
              final controller = AppThemeController.instance;
              return AnimatedBuilder(
                animation: controller,
                builder: (context, _) {
                  final palette = controller.palette;
                  return AppThemePanel(
                    elevated: false,
                    alt: true,
                    padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 12),
                    child: InkWell(
                      onTap: () => showAppThemePicker(context),
                      child: Row(
                        children: <Widget>[
                          Container(
                            width: 38,
                            height: 38,
                            decoration: BoxDecoration(
                              gradient: LinearGradient(
                                colors: <Color>[palette.primary, palette.accent],
                              ),
                              borderRadius: BorderRadius.circular(
                                palette.geometry == AppThemeGeometry.rounded ? 10 : 1,
                              ),
                            ),
                            child: Icon(
                              controller.theme.icon,
                              color: palette.widgetText,
                              size: 21,
                            ),
                          ),
                          const SizedBox(width: 12),
                          Expanded(
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: <Widget>[
                                Text(
                                  'Giao diện',
                                  style: TextStyle(
                                    color: palette.textPrimary,
                                    fontWeight: FontWeight.w800,
                                  ),
                                ),
                                const SizedBox(height: 2),
                                Text(
                                  controller.theme.label,
                                  style: TextStyle(
                                    color: palette.textSecondary,
                                    fontSize: 11.5,
                                  ),
                                ),
                              ],
                            ),
                          ),
                          Icon(
                            Icons.chevron_right_rounded,
                            color: palette.textSecondary,
                          ),
                        ],
                      ),
                    ),
                  );
                },
              );
            }
          }
          '''
          t = t[:start] + replacement
          theme.write_text(t, encoding='utf-8')
          PY

      - name: Replace widget layout with themed full-frame stack
        shell: bash
        run: |
          cat > platform/android_widget/app/src/main/res/layout/schedule_widget.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/schedule_widget_background"
              android:clipChildren="true"
              android:clipToOutline="true"
              android:clipToPadding="true"
              android:outlineProvider="background">

              <ImageView
                  android:id="@+id/widget_theme_background"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:clickable="false"
                  android:contentDescription="@null"
                  android:focusable="false"
                  android:scaleType="fitXY" />

              <StackView
                  android:id="@+id/widget_list"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_gravity="center"
                  android:animateFirstView="false"
                  android:clickable="true"
                  android:clipChildren="true"
                  android:clipToPadding="true"
                  android:loopViews="true" />

              <TextView
                  android:id="@+id/widget_empty"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:gravity="center"
                  android:paddingStart="18dp"
                  android:paddingEnd="48dp"
                  android:text="Không có lịch học"
                  android:textColor="#FFFFFFFF"
                  android:textSize="14sp"
                  android:textStyle="bold" />

              <ImageView
                  android:id="@+id/widget_stack_peek_mask"
                  android:layout_width="40dp"
                  android:layout_height="26dp"
                  android:layout_gravity="bottom|end"
                  android:background="@drawable/schedule_widget_stack_peek_mask"
                  android:clickable="false"
                  android:contentDescription="@null"
                  android:focusable="false" />

              <ImageView
                  android:id="@+id/widget_calendar"
                  android:layout_width="36dp"
                  android:layout_height="36dp"
                  android:layout_gravity="top|end"
                  android:layout_marginTop="4dp"
                  android:layout_marginEnd="8dp"
                  android:background="@android:color/transparent"
                  android:clickable="true"
                  android:contentDescription="Chọn ngày hiển thị"
                  android:focusable="true"
                  android:padding="7dp"
                  android:src="@drawable/ic_widget_calendar" />
          </FrameLayout>
          XML

      - name: Patch widget renderer and collection behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          service = Path('platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt')
          s = service.read_text(encoding='utf-8')
          s = s.replace('import android.graphics.RectF\n', '')
          start = s.index('        val radius = heightPx * CORNER_RADIUS_HEIGHT_FRACTION')
          end = s.index('\n\n        // Every coordinate', start)
          s = s[:start] + '''        // Fill the complete item; the RemoteViews item owns the rounded clip.
          canvas.drawRect(0f, 0f, widthPx, heightPx, backgroundPaint)''' + s[end:]
          s = s.replace(
              'textSize = heightPx * SUBJECT_TEXT_HEIGHT_FRACTION',
              'textSize = heightPx * SUBJECT_TEXT_HEIGHT_FRACTION * if (theme.key == "minecraft") 0.86f else 1f',
              1,
          )
          s = s.replace(
              'textSize = heightPx * DETAIL_TEXT_HEIGHT_FRACTION',
              'textSize = heightPx * DETAIL_TEXT_HEIGHT_FRACTION * if (theme.key == "minecraft") 0.84f else 1f',
              1,
          )
          start = s.index('        val timeWidth = detailPaint.measureText(item.time)')
          end = s.index('\n        val room = TextUtils.ellipsize(', start)
          detail_block = '''        var timeWidth = detailPaint.measureText(item.time)
          val availableDetailWidth = (detailRight - left).coerceAtLeast(1f)
          val minRoomWidth = widthPx * MIN_DETAIL_WIDTH_FRACTION
          val detailGap = widthPx * DETAIL_GAP_WIDTH_FRACTION
          if (item.time.isNotBlank() && timeWidth + minRoomWidth + detailGap > availableDetailWidth) {
              val fitScale = ((availableDetailWidth - minRoomWidth - detailGap) / timeWidth)
                  .coerceIn(MIN_DETAIL_FIT_SCALE, 1f)
              detailPaint.textSize *= fitScale
              timeWidth = detailPaint.measureText(item.time)
          }
          val roomMaxWidth = (
              detailRight - left - timeWidth - detailGap
          ).coerceAtLeast(minRoomWidth)'''
          s = s[:start] + detail_block + s[end:]
          s = s.replace('private const val MIN_SUBJECT_FIT_SCALE = 0.78f', 'private const val MIN_SUBJECT_FIT_SCALE = 0.64f\nprivate const val MIN_DETAIL_FIT_SCALE = 0.72f', 1)
          s = s.replace('private const val CORNER_RADIUS_HEIGHT_FRACTION = 0.28f\n', '')
          service.write_text(s, encoding='utf-8')

          provider = Path('platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt')
          p = provider.read_text(encoding='utf-8')
          p = p.replace('import android.content.SharedPreferences\n', 'import android.content.SharedPreferences\nimport android.graphics.Bitmap\nimport android.graphics.Canvas\nimport android.graphics.LinearGradient\nimport android.graphics.Paint\nimport android.graphics.Shader\n', 1)

          padding_end = '''            views.setViewPadding(
              R.id.widget_calendar,
              calendarPaddingPx,
              calendarPaddingPx,
              calendarPaddingPx,
              calendarPaddingPx,
          )'''
          if padding_end not in p:
              raise SystemExit('calendar padding block missing')
          p = p.replace(padding_end, padding_end + '''
              views.setViewLayoutWidth(
                  R.id.widget_stack_peek_mask,
                  widthDp * STACK_MASK_WIDTH_FRACTION,
                  TypedValue.COMPLEX_UNIT_DIP,
              )
              views.setViewLayoutHeight(
                  R.id.widget_stack_peek_mask,
                  heightDp * STACK_MASK_HEIGHT_FRACTION,
                  TypedValue.COMPLEX_UNIT_DIP,
              )''', 1)

          start = p.index('        val sizeToken = String.format(')
          end = p.index('\n        views.setEmptyView(R.id.widget_list, R.id.widget_empty)', start)
          new_adapter = '''        val theme = readThemeColors(context)
          views.setImageViewBitmap(
              R.id.widget_theme_background,
              renderThemeBackground(context, renderWidthDp, renderHeightDp, theme),
          )
          views.setInt(R.id.widget_stack_peek_mask, "setBackgroundColor", theme.endColor)
          views.setInt(R.id.widget_calendar, "setColorFilter", theme.iconColor)
          views.setTextColor(R.id.widget_empty, theme.textColor)

          val sizeToken = String.format(
              Locale.US,
              "%.1fx%.1f",
              widthDp,
              heightDp,
          )
          val serviceIntent = Intent(context, ScheduleWidgetService::class.java).apply {
              putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, widgetId)
              putExtra(EXTRA_RENDER_WIDTH_DP, renderWidthDp)
              putExtra(EXTRA_RENDER_HEIGHT_DP, renderHeightDp)
              data = Uri.parse("better-phenikaa://widget/$widgetId/$sizeToken/${theme.key}")
          }
          views.setRemoteAdapter(R.id.widget_list, serviceIntent)'''
          p = p[:start] + new_adapter + p[end:]

          reset_start = p.index('        // The selected day (today by default) remains the first item')
          reset_end = p.index('\n        return views', reset_start)
          reset_block = '''        val selectionPrefs = context.getSharedPreferences(
              WIDGET_SELECTION_PREFS,
              Context.MODE_PRIVATE,
          )
          if (selectionPrefs.getBoolean(resetChildKey(widgetId), false)) {
              views.setDisplayedChild(R.id.widget_list, 0)
              selectionPrefs.edit().remove(resetChildKey(widgetId)).apply()
          }'''
          p = p[:reset_start] + reset_block + p[reset_end:]

          helper_marker = '    @Suppress("DEPRECATION")\n    private fun exactWidgetSizes'
          if helper_marker not in p:
              raise SystemExit('provider helper marker missing')
          helpers = r'''    private data class ThemeColors(
              val key: String,
              val startColor: Int,
              val endColor: Int,
              val textColor: Int,
              val iconColor: Int,
          )

          private fun readThemeColors(context: Context): ThemeColors {
              val key = context
                  .getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE)
                  .getString("flutter.appTheme", "classic")
                  ?: "classic"
              return when (key) {
                  "lol" -> ThemeColors(key, 0xFF06131A.toInt(), 0xFF0B343A.toInt(), 0xFFF0E6D2.toInt(), 0xFFF0E6D2.toInt())
                  "valorant" -> ThemeColors(key, 0xFF0F1923.toInt(), 0xFF24313B.toInt(), 0xFFECE8E1.toInt(), 0xFFECE8E1.toInt())
                  "minecraft" -> ThemeColors(key, 0xFF3A2B20.toInt(), 0xFF6B4A2F.toInt(), 0xFFFFFFFF.toInt(), 0xFFFFFFFF.toInt())
                  "facebook" -> ThemeColors(key, 0xFFFFFFFF.toInt(), 0xFFE7F3FF.toInt(), 0xFF050505.toInt(), 0xFF0866FF.toInt())
                  "shopee" -> ThemeColors(key, 0xFFEE4D2D.toInt(), 0xFFFF6A3D.toInt(), 0xFFFFFFFF.toInt(), 0xFFFFFFFF.toInt())
                  "tiktok" -> ThemeColors(key, 0xFF111111.toInt(), 0xFF2A1520.toInt(), 0xFFFFFFFF.toInt(), 0xFFFFFFFF.toInt())
                  "ben10" -> ThemeColors(key, 0xFF101510.toInt(), 0xFF1D5F22.toInt(), 0xFFFFFFFF.toInt(), 0xFFFFFFFF.toInt())
                  "youtube" -> ThemeColors(key, 0xFF181818.toInt(), 0xFF2B0E14.toInt(), 0xFFFFFFFF.toInt(), 0xFFFFFFFF.toInt())
                  "steam" -> ThemeColors(key, 0xFF171D25.toInt(), 0xFF1B3D55.toInt(), 0xFFD6E9F8.toInt(), 0xFFD6E9F8.toInt())
                  else -> ThemeColors("classic", 0xFF173A8E.toInt(), 0xFF315AB5.toInt(), 0xFFFFFFFF.toInt(), 0xFFFFFFFF.toInt())
              }
          }

          private fun renderThemeBackground(
              context: Context,
              widthDp: Int,
              heightDp: Int,
              theme: ThemeColors,
          ): Bitmap {
              val density = context.resources.displayMetrics.density
              val width = (widthDp.coerceAtLeast(1) * density).roundToInt().coerceAtLeast(1)
              val height = (heightDp.coerceAtLeast(1) * density).roundToInt().coerceAtLeast(1)
              val bitmap = Bitmap.createBitmap(width, height, Bitmap.Config.ARGB_8888)
              val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  shader = LinearGradient(
                      0f,
                      0f,
                      width.toFloat(),
                      0f,
                      theme.startColor,
                      theme.endColor,
                      Shader.TileMode.CLAMP,
                  )
              }
              Canvas(bitmap).drawRect(0f, 0f, width.toFloat(), height.toFloat(), paint)
              return bitmap
          }

          '''
          p = p.replace(helper_marker, helpers + helper_marker, 1)
          p = p.replace(
              '        fun selectedDateKey(widgetId: Int): String = "selected_date_$widgetId"',
              '        fun selectedDateKey(widgetId: Int): String = "selected_date_$widgetId"\n        fun resetChildKey(widgetId: Int): String = "reset_child_$widgetId"',
              1,
          )
          p = p.replace(
              '        private const val CALENDAR_PADDING_FRACTION = 0.19f',
              '        private const val CALENDAR_PADDING_FRACTION = 0.19f\n        private const val STACK_MASK_WIDTH_FRACTION = 0.11f\n        private const val STACK_MASK_HEIGHT_FRACTION = 0.40f',
              1,
          )
          provider.write_text(p, encoding='utf-8')

          picker = Path('platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/WidgetDatePickerActivity.kt')
          d = picker.read_text(encoding='utf-8')
          needle = '.putString(ScheduleWidgetProvider.selectedDateKey(widgetId), date)\n            .apply()'
          repl = '.putString(ScheduleWidgetProvider.selectedDateKey(widgetId), date)\n            .putBoolean(ScheduleWidgetProvider.resetChildKey(widgetId), true)\n            .apply()'
          if needle not in d:
              raise SystemExit('date picker marker missing')
          d = d.replace(needle, repl, 1)
          picker.write_text(d, encoding='utf-8')
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap Android and dependencies
        run: bash tool/bootstrap.sh

      - name: Format Dart
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify fixes and untouched QLDT logic
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'addListener(_handleThemeChanged)' lib/app/app.dart
          grep -q 'animation: controller' lib/theme/app_theme.dart
          grep -q 'widget_theme_background' platform/android_widget/app/src/main/res/layout/schedule_widget.xml
          ! grep -q 'widget_stack_peek_mask_layer' platform/android_widget/app/src/main/res/layout/schedule_widget.xml
          grep -q 'renderThemeBackground' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          grep -q 'resetChildKey' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/WidgetDatePickerActivity.kt
          grep -q 'MIN_DETAIL_FIT_SCALE' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt
          grep -q 'qldtbeta.phenikaa-uni.edu.vn' lib/features/qldt_intake/qldt_login_mobile.dart
          grep -q 'edu.system.makeRequest' lib/features/qldt_intake/qldt_login_mobile.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Persist fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cooc'
          git config user.email 'minhdaonguyenad@gmail.com'
          git add lib platform/android_widget
          git commit -m 'fix: make themes live and stabilize themed widget stack'
          git push origin HEAD:main

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better_Phenikaa_App_v2.0.1.apk
          sha256sum dist/Better_Phenikaa_App_v2.0.1.apk > dist/Better_Phenikaa_App_v2.0.1.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-v2.0.1-theme-widget-fix
          path: |
            dist/Better_Phenikaa_App_v2.0.1.apk
            dist/Better_Phenikaa_App_v2.0.1.sha256
          retention-days: 30
          if-no-files-found: error
