name: Fix atomic widget refresh

# rerun after fixing every buildWidgetViews call
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-atomic-widget-refresh.yml'

permissions:
  contents: write

jobs:
  fix-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply atomic refresh fix
        run: python3 tool/fix_atomic_widget_refresh.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap project
        run: bash tool/bootstrap.sh

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify targeted fixes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'widget_refresh_cover' platform/android_widget/app/src/main/res/layout/schedule_widget.xml
          grep -q 'renderWidgetRefreshCover' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt
          grep -q 'scheduleRefreshCoverHide' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          grep -q 'REFRESH_COVER_HOLD_MS = 1250L' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          grep -q 'AppThemeId.youtube => const Color(0xFF3EA6FF)' lib/app/app.dart
          grep -q 'AppThemeId.minecraft => const Color(0xFFFFCA28)' lib/app/app.dart
          grep -q 'qldtbeta.phenikaa-uni.edu.vn' lib/features/qldt_intake/qldt_login_mobile.dart
          grep -q '^version: 2.0.7+12$' pubspec.yaml

      - name: Build release APK
        run: flutter build apk --release

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better_Phenikaa_App_v2.0.7.apk
          sha256sum dist/Better_Phenikaa_App_v2.0.7.apk > dist/Better_Phenikaa_App_v2.0.7.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-v2.0.7-atomic-widget
          path: |
            dist/Better_Phenikaa_App_v2.0.7.apk
            dist/Better_Phenikaa_App_v2.0.7.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cooc'
          git config user.email 'minhdaonguyenad@gmail.com'
          git add lib/app/app.dart pubspec.yaml platform/android_widget/app/src/main/res/layout/schedule_widget.xml platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt
          git add -u tool/fix_atomic_widget_refresh.py
          git commit -m 'fix: make widget refresh atomic and improve action contrast'
          git push origin HEAD:main
