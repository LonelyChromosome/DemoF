name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap project
        run: bash tool/bootstrap.sh

      - name: Apply safe Dart fixes
        run: dart fix --apply

      - name: Format sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Build debug APK
        if: github.head_ref != 'feature/widget-theme-2.1.0'
        run: flutter build apk --debug

      - name: Build Better Phenikaa App 2.1.0
        if: github.head_ref == 'feature/widget-theme-2.1.0'
        run: flutter build apk --release

      - name: Package Better Phenikaa App 2.1.0
        if: github.head_ref == 'feature/widget-theme-2.1.0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/Better_Phenikaa_App_2.1.0.apk
          sha256sum dist/Better_Phenikaa_App_2.1.0.apk \
            > dist/Better_Phenikaa_App_2.1.0.sha256
          test -s dist/Better_Phenikaa_App_2.1.0.apk

      - name: Upload Better Phenikaa App 2.1.0
        if: github.head_ref == 'feature/widget-theme-2.1.0'
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-2.1.0
          path: |
            dist/Better_Phenikaa_App_2.1.0.apk
            dist/Better_Phenikaa_App_2.1.0.sha256
          retention-days: 14
          if-no-files-found: error
