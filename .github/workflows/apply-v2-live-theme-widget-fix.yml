name: Apply Better Phenikaa 2.0 live theme widget fix

on:
  push:
    branches:
      - main
    paths:
      - 'tool/fix_v2_live_theme_widget.py'
      - '.github/workflows/apply-v2-live-theme-widget-fix.yml'

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply resilient repair
        run: python3 tool/fix_v2_live_theme_widget.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap Android and dependencies
        run: bash tool/bootstrap.sh

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify fixes and protected logic
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'addListener(_handleThemeChanged)' lib/app/app.dart
          grep -q 'removeListener(_handleThemeChanged)' lib/app/app.dart
          grep -q 'widget_theme_background' platform/android_widget/app/src/main/res/layout/schedule_widget.xml
          ! grep -q 'widget_stack_peek_mask_layer' platform/android_widget/app/src/main/res/layout/schedule_widget.xml
          grep -q 'renderThemeBackground' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          grep -q 'sizeToken/${theme.key}' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          grep -q 'resetChildKey' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/WidgetDatePickerActivity.kt
          grep -q 'MIN_DETAIL_FIT_SCALE' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt
          grep -q 'qldtbeta.phenikaa-uni.edu.vn' lib/features/qldt_intake/qldt_login_mobile.dart
          grep -q 'edu.system.makeRequest' lib/features/qldt_intake/qldt_login_mobile.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Persist source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cooc'
          git config user.email 'minhdaonguyenad@gmail.com'
          git add lib platform/android_widget
          git add -u tool/fix_v2_live_theme_widget.py
          git commit -m 'fix: live theme refresh and stable themed widget carousel'
          git push origin HEAD:main

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better_Phenikaa_App_v2.0.1.apk
          sha256sum dist/Better_Phenikaa_App_v2.0.1.apk > dist/Better_Phenikaa_App_v2.0.1.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-v2.0.1-live-theme-widget-fix
          path: |
            dist/Better_Phenikaa_App_v2.0.1.apk
            dist/Better_Phenikaa_App_v2.0.1.sha256
          retention-days: 30
          if-no-files-found: error
