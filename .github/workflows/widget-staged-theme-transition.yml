name: Widget staged theme transition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/widget-staged-theme-transition.yml'
      - 'tool/apply_staged_widget_theme_transition.py'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged widget transition
        run: python3 tool/apply_staged_widget_theme_transition.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap project
        run: bash tool/bootstrap.sh

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify staged transition regressions
        shell: bash
        run: |
          set -euo pipefail
          M=platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/MainActivity.kt
          P=platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          S=platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt
          X=platform/android_widget/app/src/main/res/layout/schedule_widget.xml
          grep -q 'PENDING_THEME_KEY' "$M"
          grep -q 'WIDGET_TRANSITION_START_DELAY_MS = 140L' "$M"
          grep -q 'beginStagedThemeTransition' "$P"
          grep -q 'preserveTransitionCover = true' "$P"
          grep -q 'renderWidgetThemeWipeFrame' "$P"
          grep -q 'transition_from_theme_' "$P"
          grep -q 'WIDGET_THEME_STATE_PREFS' "$S"
          grep -q 'renderWidgetThemeHoldFrame' "$S"
          grep -q 'renderWidgetThemeWipeFrame' "$S"
          python3 - <<'PY'
          from pathlib import Path
          x = Path('platform/android_widget/app/src/main/res/layout/schedule_widget.xml').read_text()
          assert x.index('widget_empty') < x.index('widget_refresh_cover'), 'cover must render above empty view'
          PY
          grep -q '^version: 2.0.11+16$' pubspec.yaml
          ! grep -q 'setDisplayedChild(R.id.widget_list, 0)' "$P" || grep -q 'resetChildKey(widgetId)' "$P"

      - name: Build release APK
        run: flutter build apk --release

      - name: Package APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better_Phenikaa_App_v2.0.11.apk
          sha256sum dist/Better_Phenikaa_App_v2.0.11.apk > dist/Better_Phenikaa_App_v2.0.11.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-v2.0.11-staged-transition
          path: dist/*
          retention-days: 30

      - name: Commit staged transition source
        shell: bash
        run: |
          git config user.name 'cooc'
          git config user.email 'minhdaonguyenad@gmail.com'
          git add platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/MainActivity.kt \
                  platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt \
                  platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt \
                  platform/android_widget/app/src/main/res/layout/schedule_widget.xml \
                  pubspec.yaml
          git commit -m 'fix: keep old widget theme until staged transition'
          git push origin HEAD:main
