name: Apply Better Phenikaa 2.0 themes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-themes-v2.yml'

permissions:
  contents: write

jobs:
  apply-themes:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout DemoF
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone previous encryption-theme source
        run: |
          git clone --depth 1 https://github.com/LonelyChromosome/demoE.git /tmp/demoE

      - name: Python theme tooling
        run: |
          python3 -m pip install --disable-pip-version-check 'fonttools[woff]' brotli

      - name: Finalize one-shot generator
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tool/implement_themes_v2.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Icons.facebook_rounded', 'Icons.facebook')
          replacements = {
              "        canvas.drawRect(Rect.fromLTWH(0, 0, size.width, block * .28), paint);\n      case AppThemeId.valorant:":
                  "        canvas.drawRect(Rect.fromLTWH(0, 0, size.width, block * .28), paint);\n        break;\n      case AppThemeId.valorant:",
              "        canvas.drawPath(path2, paint);\n      case AppThemeId.lol:":
                  "        canvas.drawPath(path2, paint);\n        break;\n      case AppThemeId.lol:",
              "        canvas.drawCircle(Offset(size.width * .5, size.height * .12), size.width * .31, line);\n      case AppThemeId.tiktok:":
                  "        canvas.drawCircle(Offset(size.width * .5, size.height * .12), size.width * .31, line);\n        break;\n      case AppThemeId.tiktok:",
              "        canvas.drawCircle(Offset(size.width * .05, size.height * .76), size.width * .3, cyan);\n      case AppThemeId.ben10:":
                  "        canvas.drawCircle(Offset(size.width * .05, size.height * .76), size.width * .3, cyan);\n        break;\n      case AppThemeId.ben10:",
              "        canvas.drawCircle(Offset(size.width * .86, size.height * .12), size.width * .22, ring);\n      case AppThemeId.youtube:":
                  "        canvas.drawCircle(Offset(size.width * .86, size.height * .12), size.width * .22, ring);\n        break;\n      case AppThemeId.youtube:",
              "        canvas.drawCircle(Offset(size.width * .52, 0), size.width * .55, glow);\n      case AppThemeId.steam:":
                  "        canvas.drawCircle(Offset(size.width * .52, 0), size.width * .55, glow);\n        break;\n      case AppThemeId.steam:",
              "        canvas.drawRect(rect, glow);\n      case AppThemeId.shopee:":
                  "        canvas.drawRect(rect, glow);\n        break;\n      case AppThemeId.shopee:",
              "        canvas.drawRect(Rect.fromLTWH(0, 0, size.width, size.height * .14), band);\n      case AppThemeId.facebook:":
                  "        canvas.drawRect(Rect.fromLTWH(0, 0, size.width, size.height * .14), band);\n        break;\n      case AppThemeId.facebook:",
              "      case AppThemeId.facebook:\n      case AppThemeId.classic:\n        break;":
                  "      case AppThemeId.facebook:\n      case AppThemeId.classic:\n        break;",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Generator patch marker missing: {old[:70]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Generate Better Phenikaa 2.0 theme system
        run: python3 tool/implement_themes_v2.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap Android and dependencies
        run: bash tool/bootstrap.sh

      - name: Apply safe Dart fixes
        run: dart fix --apply

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify theme integration without logic replacement
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'enum AppThemeId' lib/theme/app_theme.dart
          grep -q 'AppThemeId.minecraft' lib/theme/app_theme.dart
          grep -q 'AppThemeId.valorant' lib/theme/app_theme.dart
          grep -q 'AppThemeId.lol' lib/theme/app_theme.dart
          grep -q "label: 'Giao diện'" lib/app/app.dart
          grep -q 'qldtbeta.phenikaa-uni.edu.vn' lib/features/qldt_intake/qldt_login_mobile.dart
          grep -q 'edu.system.makeRequest' lib/features/qldt_intake/qldt_login_mobile.dart
          grep -q 'setRemoteAdapter' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          grep -q 'readWidgetClasses' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt
          grep -q 'R.font.minecraft_custom' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt
          test -s assets/fonts/minecraft.ttf
          test -s platform/android_widget/app/src/main/res/font/minecraft_custom.ttf
          grep -q '^version: 2.0.0+5$' pubspec.yaml

      - name: Build release APK
        run: flutter build apk --release

      - name: Persist Better Phenikaa 2.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cooc'
          git config user.email 'minhdaonguyenad@gmail.com'
          git add lib pubspec.yaml assets platform/android_widget
          git add -u tool/implement_themes_v2.py
          git commit -m 'feat: add full app and widget theme system for 2.0'
          git push origin HEAD:main

      - name: Package Better Phenikaa 2.0 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better_Phenikaa_App_v2.0.0.apk
          sha256sum dist/Better_Phenikaa_App_v2.0.0.apk > dist/Better_Phenikaa_App_v2.0.0.sha256
          ls -lh dist

      - name: Upload Better Phenikaa 2.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-v2.0.0-themes
          path: |
            dist/Better_Phenikaa_App_v2.0.0.apk
            dist/Better_Phenikaa_App_v2.0.0.sha256
          retention-days: 30
          if-no-files-found: error
