name: Apply Better Phenikaa 2.0.2 polish

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v2-0-2-polish.yml'

permissions:
  contents: write

jobs:
  polish-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 2.0.2 fixes
        run: python3 tool/fix_v2_0_2_polish.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap project
        run: bash tool/bootstrap.sh

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify fixes
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 2.0.2+7$' pubspec.yaml
          grep -A8 'class AppThemeSettingButton' lib/theme/app_theme.dart | grep -q 'final controller = AppThemeController.instance'
          grep -q 'return AnimatedBuilder' lib/theme/app_theme.dart
          grep -q 'schedule_widget_outline' platform/android_widget/app/src/main/res/layout/schedule_widget.xml
          grep -q '@android:color/transparent' platform/android_widget/app/src/main/res/layout/schedule_widget_item.xml
          grep -q 'better-phenikaa://widget/\$widgetId/\$sizeToken")' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          ! grep -q 'sizeToken/\${theme.key}' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          grep -q 'val item = items.firstOrNull() ?: return null' platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt

      - name: Build release APK
        run: flutter build apk --release

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better_Phenikaa_App_v2.0.2.apk
          sha256sum dist/Better_Phenikaa_App_v2.0.2.apk > dist/Better_Phenikaa_App_v2.0.2.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-v2.0.2-polish
          path: |
            dist/Better_Phenikaa_App_v2.0.2.apk
            dist/Better_Phenikaa_App_v2.0.2.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Commit polished source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cooc'
          git config user.email 'minhdaonguyenad@gmail.com'
          git rm tool/fix_v2_0_2_polish.py .github/workflows/apply-v2-0-2-polish.yml
          git add lib pubspec.yaml platform/android_widget
          git commit -m 'fix: polish live theme and instant widget refresh'
          git pull --rebase origin main
          git push origin HEAD:main
