name: Atomic widget theme v2.0.5

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/atomic-widget-theme-v205.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply atomic widget theme architecture
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # 1) Flutter: notify native widget immediately at the exact theme tap.
          p = Path('lib/theme/app_theme.dart')
          s = p.read_text(encoding='utf-8')
          if "package:flutter/services.dart" not in s:
              s = s.replace(
                  "import 'package:flutter/material.dart';\n",
                  "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\n",
                  1,
              )
          old = """  static const _preferenceKey = 'better_phenikaa_theme_v2';
  static const _widgetPreferenceKey = 'appTheme';
"""
          new = """  static const _preferenceKey = 'better_phenikaa_theme_v2';
  static const _widgetPreferenceKey = 'appTheme';
  static const MethodChannel _widgetThemeChannel = MethodChannel(
    'better_phenikaa/widget_theme',
  );
"""
          if old not in s and '_widgetThemeChannel' not in s:
              raise SystemExit('theme controller constants marker missing')
          if '_widgetThemeChannel' not in s:
              s = s.replace(old, new, 1)

          old_select = """  Future<void> select(AppThemeId value) async {
    if (_theme == value) return;
    _theme = value;
    notifyListeners();
    final prefs = await SharedPreferences.getInstance();
    await Future.wait<bool>(<Future<bool>>[
      prefs.setString(_preferenceKey, value.storageKey),
      prefs.setString(_widgetPreferenceKey, value.storageKey),
    ]);
    await _syncWidgetTheme();
  }

  Future<void> _syncWidgetTheme() async {
"""
          new_select = """  Future<void> select(AppThemeId value) async {
    if (_theme == value) return;
    _theme = value;
    notifyListeners();

    // Start the native widget update immediately, while the user is still inside
    // the theme picker. Android writes the same preference synchronously before
    // asking the launcher to redraw, so going Home does not wait for Flutter's
    // SharedPreferences/home_widget round-trip.
    final nativeUpdate = _applyWidgetThemeImmediately(value.storageKey);
    final prefs = await SharedPreferences.getInstance();
    await Future.wait<bool>(<Future<bool>>[
      prefs.setString(_preferenceKey, value.storageKey),
      prefs.setString(_widgetPreferenceKey, value.storageKey),
    ]);
    final nativeApplied = await nativeUpdate;
    if (!nativeApplied) {
      await _syncWidgetTheme();
    }
  }

  Future<bool> _applyWidgetThemeImmediately(String themeKey) async {
    if (kIsWeb || defaultTargetPlatform != TargetPlatform.android) return false;
    try {
      await _widgetThemeChannel.invokeMethod<int>(
        'applyTheme',
        <String, Object>{'theme': themeKey},
      );
      return true;
    } on MissingPluginException {
      return false;
    } on PlatformException {
      return false;
    }
  }

  Future<void> _syncWidgetTheme() async {
"""
          if old_select not in s:
              raise SystemExit('select method marker missing')
          s = s.replace(old_select, new_select, 1)
          p.write_text(s, encoding='utf-8')

          # 2) Native bridge: update SharedPreferences and AppWidget synchronously
          # from the exact tap, instead of waiting for a broadcast/plugin update.
          main = Path('platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/MainActivity.kt')
          main.parent.mkdir(parents=True, exist_ok=True)
          main.write_text(r'''package vn.edu.phenikaa.better_phenikaa_schedule

import android.appwidget.AppWidgetManager
import android.content.ComponentName
import android.content.Context
import io.flutter.embedding.android.FlutterActivity
import io.flutter.embedding.engine.FlutterEngine
import io.flutter.plugin.common.MethodChannel

class MainActivity : FlutterActivity() {
    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
        super.configureFlutterEngine(flutterEngine)
        MethodChannel(
            flutterEngine.dartExecutor.binaryMessenger,
            WIDGET_THEME_CHANNEL,
        ).setMethodCallHandler { call, result ->
            if (call.method != "applyTheme") {
                result.notImplemented()
                return@setMethodCallHandler
            }

            val theme = call.argument<String>("theme") ?: "classic"
            val prefs = getSharedPreferences(FLUTTER_PREFS, Context.MODE_PRIVATE)
            // commit() is deliberate: the widget factory must see the exact new
            // theme before AppWidgetManager starts rendering this same request.
            prefs.edit().putString(THEME_KEY, theme).commit()

            val manager = AppWidgetManager.getInstance(this)
            val component = ComponentName(this, ScheduleWidgetProvider::class.java)
            val widgetIds = manager.getAppWidgetIds(component)
            if (widgetIds.isNotEmpty()) {
                ScheduleWidgetProvider().onUpdate(this, manager, widgetIds, prefs)
            }
            result.success(widgetIds.size)
        }
    }

    companion object {
        private const val WIDGET_THEME_CHANNEL = "better_phenikaa/widget_theme"
        private const val FLUTTER_PREFS = "FlutterSharedPreferences"
        private const val THEME_KEY = "flutter.appTheme"
    }
}
''', encoding='utf-8')

          # 3) One color owner only: StackView item bitmap becomes transparent.
          # The full widget background is rendered by widget_theme_background, so
          # old/new collection children can never expose large mixed-theme blocks.
          service = Path('platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt')
          t = service.read_text(encoding='utf-8')
          t = t.replace('import android.graphics.LinearGradient\n', '')
          t = t.replace('import android.graphics.Shader\n', '')
          background = """        val theme = readWidgetTheme(context)
        val backgroundPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
            shader = LinearGradient(
                0f,
                0f,
                widthPx,
                0f,
                theme.startColor,
                theme.endColor,
                Shader.TileMode.CLAMP,
            )
        }
        canvas.drawRect(0f, 0f, widthPx, heightPx, backgroundPaint)

"""
          if background not in t:
              raise SystemExit('widget item background marker missing')
          t = t.replace(background, '        val theme = readWidgetTheme(context)\n\n', 1)
          service.write_text(t, encoding='utf-8')

          # 4) The old lower-right theme-colored mask itself can become a stale
          # colored patch. With transparent child backgrounds it is no longer
          # needed, so keep it in layout for compatibility but never render it.
          layout = Path('platform/android_widget/app/src/main/res/layout/schedule_widget.xml')
          x = layout.read_text(encoding='utf-8')
          marker = '        android:id="@+id/widget_stack_peek_mask"\n'
          if marker not in x:
              raise SystemExit('peek mask marker missing')
          if 'android:visibility="gone"' not in x[x.index(marker):x.index(marker)+400]:
              x = x.replace(
                  marker,
                  marker + '        android:visibility="gone"\n',
                  1,
              )
          layout.write_text(x, encoding='utf-8')

          # 5) Provider: stop resizing/recoloring the hidden mask. Keep the single
          # outer background + calendar icon in one RemoteViews transaction, then
          # refresh transparent content bitmaps.
          provider = Path('platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt')
          q = provider.read_text(encoding='utf-8')
          q = re.sub(
              r'''\n            views\.setViewLayoutWidth\(\n                R\.id\.widget_stack_peek_mask,\n                widthDp \* STACK_MASK_WIDTH_FRACTION,\n                TypedValue\.COMPLEX_UNIT_DIP,\n            \)\n            views\.setViewLayoutHeight\(\n                R\.id\.widget_stack_peek_mask,\n                heightDp \* STACK_MASK_HEIGHT_FRACTION,\n                TypedValue\.COMPLEX_UNIT_DIP,\n            \)''',
              '',
              q,
              count=1,
          )
          q = q.replace('        views.setInt(R.id.widget_stack_peek_mask, "setBackgroundColor", theme.endColor)\n', '')
          q = q.replace('        private const val STACK_MASK_WIDTH_FRACTION = 0.11f\n', '')
          q = q.replace('        private const val STACK_MASK_HEIGHT_FRACTION = 0.40f\n', '')
          provider.write_text(q, encoding='utf-8')

          # 6) Version.
          pub = Path('pubspec.yaml')
          u = pub.read_text(encoding='utf-8')
          u = re.sub(r'^version:.*$', 'version: 2.0.5+10', u, count=1, flags=re.M)
          pub.write_text(u, encoding='utf-8')
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap project
        run: bash tool/bootstrap.sh

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify atomic widget theme implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -q "better_phenikaa/widget_theme" lib/theme/app_theme.dart
          grep -q "applyTheme" platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/MainActivity.kt
          grep -q "prefs.edit().putString(THEME_KEY, theme).commit()" platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/MainActivity.kt
          ! grep -q "backgroundPaint = Paint" platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt
          grep -A3 'widget_stack_peek_mask' platform/android_widget/app/src/main/res/layout/schedule_widget.xml | grep -q 'visibility="gone"'
          grep -q '^version: 2.0.5+10$' pubspec.yaml
          grep -q 'qldtbeta.phenikaa-uni.edu.vn' lib/features/qldt_intake/qldt_login_mobile.dart
          grep -q 'edu.system.makeRequest' lib/features/qldt_intake/qldt_login_mobile.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Persist source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cooc'
          git config user.email 'minhdaonguyenad@gmail.com'
          git add lib/theme/app_theme.dart pubspec.yaml platform/android_widget
          git commit -m 'fix: make widget theme updates atomic and immediate'
          git push origin HEAD:main

      - name: Package APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better_Phenikaa_App_v2.0.5_atomic_widget_theme.apk
          sha256sum dist/Better_Phenikaa_App_v2.0.5_atomic_widget_theme.apk > dist/Better_Phenikaa_App_v2.0.5_atomic_widget_theme.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-v2.0.5-atomic-widget-theme
          path: |
            dist/Better_Phenikaa_App_v2.0.5_atomic_widget_theme.apk
            dist/Better_Phenikaa_App_v2.0.5_atomic_widget_theme.sha256
          retention-days: 30
          if-no-files-found: error
