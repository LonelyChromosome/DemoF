name: Fix widget refresh readiness handshake

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-widget-ready-handshake.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply readiness handshake
        run: python3 tool/apply_widget_refresh_ready_handshake.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Bootstrap project
        run: bash tool/bootstrap.sh

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify refresh handshake and regressions
        shell: bash
        run: |
          set -euo pipefail
          P=platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt
          S=platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt
          A=lib/app/app.dart
          M=platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/MainActivity.kt
          grep -q 'ACTION_COLLECTION_FRAME_READY' "$P"
          grep -q 'COLLECTION_READY_SETTLE_MS = 300L' "$P"
          grep -q 'readyThemeKey != readThemeColors(context).key' "$P"
          grep -q 'signalReadyOnce()' "$S"
          grep -q 'context.sendBroadcast' "$S"
          ! grep -q 'REFRESH_COVER_HOLD_MS' "$P"
          ! grep -q 'scheduleRefreshCoverHide' "$P"
          grep -q 'ScheduleWidgetProvider().onUpdate' "$M"
          grep -q 'widget_list, View.INVISIBLE' "$P"
          grep -q 'AppThemeId.youtube => const Color(0xFF3EA6FF)' "$A"
          grep -q 'AppThemeId.valorant => const Color(0xFF56D6C7)' "$A"
          grep -q 'AppThemeId.minecraft => const Color(0xFF42A5F5)' "$A"
          grep -q '^version: 2.0.9+14$' pubspec.yaml

      - name: Build release APK
        run: flutter build apk --release

      - name: Package APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better_Phenikaa_App_v2.0.9.apk
          sha256sum dist/Better_Phenikaa_App_v2.0.9.apk > dist/Better_Phenikaa_App_v2.0.9.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-App-v2.0.9-widget-ready-handshake
          path: dist/*
          retention-days: 30

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'cooc'
          git config user.email 'minhdaonguyenad@gmail.com'
          git add platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetProvider.kt \
                  platform/android_widget/app/src/main/kotlin/vn/edu/phenikaa/better_phenikaa_schedule/ScheduleWidgetService.kt \
                  pubspec.yaml
          git commit -m 'fix: reveal widget stack only after launcher renders new frame'
          git push origin HEAD:main
